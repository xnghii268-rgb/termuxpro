name: Build Termux Pro Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      packages:
        description: 'Danh sách các gói cần biên dịch thêm'
        required: false
        default: 'bash coreutils curl ca-certificates openssl dpkg apt termux-tools termux-exec nano git'
        type: string

permissions:
  contents: write

jobs:
  build-and-sign:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK licenses & NDK
        run: |
          set -e
          echo "Accepting Android SDK licenses..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          echo "Ensuring required platform and build tools..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-28" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Install build & packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar xz-utils zip jq coreutils dpkg-dev apt-utils gnupg

      - name: Import GPG APT signing key
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_KEY" ]; then
            echo "$GPG_KEY" | gpg --batch --import
            echo "GPG signing key imported successfully."
          else
            echo "Warning: GPG_PRIVATE_KEY secret is not set."
          fi

      - name: Clone termux-packages & generate custom bootstrap
        run: |
          set -e
          echo "Cloning termux-packages..."
          git clone --depth 1 https://github.com/termux/termux-packages.git $HOME/termux-packages
          cd $HOME/termux-packages

          echo "Generating base bootstrap-aarch64..."
          ./scripts/generate-bootstraps.sh --architectures aarch64 --pm apt

          BS_FILE=$(find . -name "bootstrap-aarch64.zip" | head -n 1)
          if [ -z "$BS_FILE" ] || [ ! -f "$BS_FILE" ]; then
            echo "Error: bootstrap-aarch64.zip not found!" >&2
            exit 1
          fi

          echo "Extracting bootstrap archive for prefix audit & patching..."
          mkdir -p $HOME/bs-patch && cd $HOME/bs-patch
          unzip -q "$HOME/termux-packages/$BS_FILE"

          echo "Patching all /data/data/com.termux paths in text/scripts to /data/data/com.termuxpro.app (strictly skipping ELF binaries)..."
          python3 -c "
          import os, re
          regex = re.compile(rb'/data/data/com\.termux([/\"\x27:; =]|$)')
          patched = 0
          skipped_elf = 0
          for root, dirs, files in os.walk('.'):
              for f in files:
                  p = os.path.join(root, f)
                  if os.path.islink(p): continue
                  try:
                      with open(p, 'rb') as fp:
                          head = fp.read(4)
                          if head == b'\x7fELF':
                              skipped_elf += 1
                              continue  # NEVER MUTATE ELF BINARIES
                          fp.seek(0)
                          data = fp.read()
                  except Exception: continue
                  changed = False
                  if b'/data/data/com.termux' in data:
                      data = regex.sub(rb'/data/data/com.termuxpro.app\1', data)
                      changed = True
                  if b'com.termuxpro.apppro' in data:
                      data = data.replace(b'com.termuxpro.apppro.app', b'com.termuxpro.app').replace(b'com.termuxpro.apppro', b'com.termuxpro.app')
                      changed = True
                  if changed:
                      st = os.stat(p)
                      with open(p, 'wb') as fp:
                          fp.write(data)
                      os.chmod(p, st.st_mode)
                      patched += 1
          print(f'Successfully patched {patched} text/script files; preserved {skipped_elf} ELF binaries untouched.')
          "

          # Compile libtermuxpro-path.so using NDK clang
          echo "Compiling libtermuxpro-path.so compatibility interceptor..."
          NDK_ROOT="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
            NDK_ROOT=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | tail -n 1 || true)
          fi
          NDK_CLANG=$(find "$NDK_ROOT" -name "aarch64-linux-android28-clang" 2>/dev/null | head -n 1 || true)
          if [ -z "$NDK_CLANG" ]; then
            NDK_CLANG=$(find "$NDK_ROOT" -name "aarch64-linux-android*-clang" 2>/dev/null | head -n 1 || true)
          fi
          if [ -n "$NDK_CLANG" ]; then
            echo "Found NDK clang: $NDK_CLANG"
            mkdir -p lib
            $NDK_CLANG -shared -fPIC -O2 -Wall "$GITHUB_WORKSPACE/app/src/main/cpp/termuxpro-path.c" -o lib/libtermuxpro-path.so -ldl
            echo "Successfully compiled lib/libtermuxpro-path.so"
            rm -f lib/libtermux-exec*.so
            ln -sf libtermuxpro-path.so lib/libtermux-exec.so
            ln -sf libtermuxpro-path.so lib/libtermux-exec-ld-preload.so
            ln -sf libtermuxpro-path.so lib/libtermux-exec-direct-ld-preload.so
            ln -sf libtermuxpro-path.so lib/libtermux-exec-linker-ld-preload.so
          else
            echo "Warning: NDK clang not found during bootstrap generation step"
          fi

          # Configure etc/apt/apt.conf for Termux Pro prefix compatibility
          echo "Configuring etc/apt/apt.conf for Termux Pro prefix compatibility..."
          mkdir -p etc/apt/apt.conf.d etc/apt/trusted.gpg.d var/lib/apt/lists var/cache/apt/archives var/log/apt etc/dpkg/dpkg.cfg.d var/lib/dpkg/updates var/lib/dpkg/info share/terminfo
          printf '%s\n' \
          'Dir "/data/data/com.termuxpro.app/files/usr";' \
          'Dir::State "var/lib/apt";' \
          'Dir::State::status "/data/data/com.termuxpro.app/files/usr/var/lib/dpkg/status";' \
          'Dir::Cache "/data/data/com.termuxpro.app/cache/apt";' \
          'Dir::Cache::archives "archives/";' \
          'Dir::Etc "etc/apt";' \
          'Dir::Etc::parts "apt.conf.d";' \
          'Dir::Etc::sourcelist "sources.list";' \
          'Dir::Etc::sourceparts "sources.list.d";' \
          'Dir::Bin::methods "/data/data/com.termuxpro.app/files/usr/lib/apt/methods";' \
          'Dir::Bin::dpkg "/data/data/com.termuxpro.app/files/usr/bin/dpkg";' \
          'Dir::Log "var/log/apt";' \
          'DPkg::Path "/data/data/com.termuxpro.app/files/usr/bin";' \
          'DPkg::Options {' \
          '   "--admindir=/data/data/com.termuxpro.app/files/usr/var/lib/dpkg";' \
          '   "--instdir=/data/data/com.termuxpro.app/files/usr";' \
          '};' > etc/apt/apt.conf

          # Mark packages as installed in dpkg status
          if [ -f "var/lib/dpkg/status" ]; then
            sed -i 's|Status: install ok unpacked|Status: install ok installed|g' var/lib/dpkg/status
            sed -i 's|Status: install ok half-configured|Status: install ok installed|g' var/lib/dpkg/status
          fi

          # Pre-lock second stage so fallback second-stage script never runs on login
          mkdir -p etc/termux/second-stage
          ln -sf termux-bootstrap-second-stage.sh etc/termux/second-stage/termux-bootstrap-second-stage.sh.lock
          rm -f etc/profile.d/01-termux-bootstrap-second-stage-fallback.sh

          # Apply Bootstrap Overlay files
          echo "Applying Termux Pro bootstrap overlay..."
          if [ -d "$GITHUB_WORKSPACE/app/src/main/assets/bootstrap-overlay" ]; then
            cp -rf "$GITHUB_WORKSPACE/app/src/main/assets/bootstrap-overlay"/* .
          fi

          # Ensure shell scripts have correct permissions
          mkdir -p bin
          chmod 755 etc/motd.sh bin/tp bin/login || true
          ln -sf tp bin/menu

          # Patch bin/login to preserve libtermuxpro-path.so in LD_PRELOAD
          if [ -f "bin/login" ]; then
            sed -i 's|unset LD_PRELOAD|true # keep LD_PRELOAD for termux pro|g' bin/login
          fi

          # Add Phase 8 shell helpers: clipimg and lastshot
          printf '%s\n' \
          '#!/data/data/com.termuxpro.app/files/usr/bin/bash' \
          'LATEST=$(ls -t "$HOME/.clip"/img-*.png 2>/dev/null | head -n 1)' \
          'if [ -n "$LATEST" ]; then' \
          '    echo "$LATEST"' \
          'else' \
          '    echo "Không tìm thấy ảnh nào trong ~/.clip" >&2' \
          '    exit 1' \
          'fi' > bin/clipimg
          chmod 755 bin/clipimg

          printf '%s\n' \
          '#!/data/data/com.termuxpro.app/files/usr/bin/bash' \
          'LATEST=$(ls -t "$HOME/storage/shared/DCIM/Screenshots"/*.{png,jpg,jpeg} "$HOME/storage/shared/Pictures/Screenshots"/*.{png,jpg,jpeg} 2>/dev/null | head -n 1)' \
          'if [ -n "$LATEST" ]; then' \
          '    echo "$LATEST"' \
          'else' \
          '    LATEST=$(ls -t "$HOME/.clip"/img-*.png 2>/dev/null | head -n 1)' \
          '    if [ -n "$LATEST" ]; then' \
          '        echo "$LATEST"' \
          '    else' \
          '        echo "Không tìm thấy ảnh chụp màn hình nào" >&2' \
          '        exit 1' \
          '    fi' \
          'fi' > bin/lastshot
          chmod 755 bin/lastshot

          # Create v8, v7, v6, v5, v4, v3 and v2 markers inside bootstrap
          touch .termuxpro-v8 .termuxpro-v7 .termuxpro-v6 .termuxpro-v5 .termuxpro-v4 .termuxpro-v3 .termuxpro-v2

          echo "GATE 2: Auditing bootstrap contents for binary safety and path correctness..."
          python3 -c "
          import os, sys
          elf_corrupted = 0
          text_leftover = 0
          mangled = 0
          elf_count = 0
          text_count = 0
          for root, dirs, files in os.walk('.'):
              for f in files:
                  p = os.path.join(root, f)
                  if os.path.islink(p): continue
                  try:
                      with open(p, 'rb') as fp:
                          head = fp.read(4)
                          fp.seek(0)
                          data = fp.read()
                  except Exception: continue
                  if head == b'\x7fELF':
                      elf_count += 1
                      if p.endswith('libtermuxpro-path.so'): continue
                      if b'com.termuxpro.app' in data:
                          print('GATE 2 ERROR: Upstream ELF binary was modified by sed/patch:', p)
                          elf_corrupted += 1
                  else:
                      text_count += 1
                      if b'/data/data/com.termux/' in data:
                          print('GATE 2 ERROR: Text file has leftover com.termux:', p)
                          text_leftover += 1
                  if b'com.termuxpro.apppro' in data:
                      print('GATE 2 ERROR: Mangled prefix in:', p)
                      mangled += 1
          print(f'GATE 2 AUDIT: {elf_count} ELF binaries verified untouched, {text_count} text files audited.')
          if elf_corrupted > 0 or text_leftover > 0 or mangled > 0:
              print(f'GATE 2 FAILED: corrupted_elf={elf_corrupted}, leftover_text={text_leftover}, mangled={mangled}')
              sys.exit(1)
          print('GATE 2 PASSED: 0 corrupted ELFs, 0 leftover com.termux in text, 0 mangled prefixes!')
          "

          # Repack bootstrap-aarch64.zip
          rm -f "$GITHUB_WORKSPACE/app/src/main/cpp/bootstrap-aarch64.zip"
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/cpp"
          zip -qry "$GITHUB_WORKSPACE/app/src/main/cpp/bootstrap-aarch64.zip" .

          # Place placeholder copies for arm, i686, x86_64 so ndkBuild never fails
          cp -f "$GITHUB_WORKSPACE/app/src/main/cpp/bootstrap-aarch64.zip" "$GITHUB_WORKSPACE/app/src/main/cpp/bootstrap-arm.zip"
          cp -f "$GITHUB_WORKSPACE/app/src/main/cpp/bootstrap-aarch64.zip" "$GITHUB_WORKSPACE/app/src/main/cpp/bootstrap-i686.zip"
          cp -f "$GITHUB_WORKSPACE/app/src/main/cpp/bootstrap-aarch64.zip" "$GITHUB_WORKSPACE/app/src/main/cpp/bootstrap-x86_64.zip"
          echo "Embedded custom bootstrap into app/src/main/cpp/."

      - name: Generate and Sign APT Repository
        run: |
          set -e
          echo "Setting up APT repository tree..."
          mkdir -p $HOME/apt-repo/dists/stable/main/binary-aarch64
          mkdir -p $HOME/apt-repo/dists/stable/main/binary-all
          mkdir -p $HOME/apt-repo/pool/main

          # Collect debs if built from termux-packages output
          if [ -d "$HOME/termux-packages/output" ]; then
            find "$HOME/termux-packages/output" -name "*.deb" -exec cp -t $HOME/apt-repo/pool/main/ {} + || true
          fi

          cd $HOME/apt-repo
          # Generate Packages metadata
          dpkg-scanpackages pool/main /dev/null > dists/stable/main/binary-aarch64/Packages || touch dists/stable/main/binary-aarch64/Packages
          gzip -9c dists/stable/main/binary-aarch64/Packages > dists/stable/main/binary-aarch64/Packages.gz
          cp -f dists/stable/main/binary-aarch64/Packages dists/stable/main/binary-all/Packages
          cp -f dists/stable/main/binary-aarch64/Packages.gz dists/stable/main/binary-all/Packages.gz

          # Generate Release file
          cd dists/stable
          printf '%s\n' \
          'Origin: Termux Pro' \
          'Label: Termux Pro Archive' \
          'Suite: stable' \
          'Codename: stable' \
          'Version: 1.0' \
          'Architectures: aarch64 all' \
          'Components: main' \
          'Description: Official APT repository for Termux Pro (com.termuxpro.app)' \
          'Date: Wed, 21 Oct 2026 12:00:00 UTC' > Release

          # Append SHA256 hashes
          echo "SHA256:" >> Release
          find main -type f | while read -r f; do
            HASH=$(sha256sum "$f" | awk '{print $1}')
            SIZE=$(stat -c%s "$f")
            printf " %s %s %s\n" "$HASH" "$SIZE" "$f" >> Release
          done

          # Sign Release with GPG
          if gpg --list-secret-keys "apt@termuxpro.app" > /dev/null 2>&1; then
            echo "Signing Release with GPG key..."
            gpg --batch --yes --default-key "apt@termuxpro.app" -abs -o Release.gpg Release
            gpg --batch --yes --default-key "apt@termuxpro.app" --clearsign -o InRelease Release
            echo "Successfully generated Release.gpg and InRelease."
          else
            echo "GPG key not available; skipping Release signature."
          fi

          # Copy public keyrings
          cd $HOME/apt-repo
          if [ -f "$GITHUB_WORKSPACE/app/src/main/assets/keys/termuxpro-archive-keyring.gpg" ]; then
            cp -f "$GITHUB_WORKSPACE/app/src/main/assets/keys/termuxpro-archive-keyring.gpg" .
            cp -f "$GITHUB_WORKSPACE/app/src/main/assets/keys/termuxpro-archive-keyring.asc" . || true
          fi

      - name: Deploy APT repository to GitHub Pages
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p $HOME/gh-pages-deploy
          cd $HOME/gh-pages-deploy
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .

          # Copy new repo files
          cp -rf $HOME/apt-repo/* .

          git add -A
          if git diff --staged --quiet; then
            echo "No changes in APT repository metadata."
          else
            git commit -m "deploy: update Termux Pro APT repository [skip ci]"
            git push origin gh-pages
            echo "APT repository published to GitHub Pages."
          fi

      - name: Prepare signing keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -e
          mkdir -p $HOME/.build-secrets
          echo "$KEYSTORE_BASE64" | base64 -d > $HOME/.build-secrets/release.keystore
          chmod 600 $HOME/.build-secrets/release.keystore
          echo "SIGNING_KEYSTORE_PATH=$HOME/.build-secrets/release.keystore" >> $GITHUB_ENV

      - name: Build and Sign Release APK (GATE 3)
        env:
          TERMUX_USE_CUSTOM_BOOTSTRAP: "true"
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

          RELEASE_DIR="app/build/outputs/apk/release"
          if [ ! -d "$RELEASE_DIR" ]; then
            echo "GATE 3 FAILED: Release output directory $RELEASE_DIR not found!" >&2
            exit 1
          fi

          APK_FILES=$(find "$RELEASE_DIR" -name "*.apk")
          if [ -z "$APK_FILES" ]; then
            echo "GATE 3 FAILED: No APK files found in $RELEASE_DIR!" >&2
            exit 1
          fi

          echo "GATE 3 PASSED: APK built and signed successfully:"
          ls -lh $RELEASE_DIR/*.apk

          cd "$RELEASE_DIR"
          sha256sum *.apk > sha256sums.txt
          cat sha256sums.txt

      - name: Secure cleanup of build secrets
        if: always()
        run: |
          rm -rf $HOME/.build-secrets || true

      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: termuxpro-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/sha256sums.txt
          retention-days: 30
